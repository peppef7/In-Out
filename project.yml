name: GestioneSpese
options:
  bundleIdPrefix: com.peppe
  deploymentTarget:
    iOS: "17.0"
targets:
  GestioneSpese:
    type: application
    platform: iOS
    sources: [GestioneSpese]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peppe.gestionespese
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Gestione Spese"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
